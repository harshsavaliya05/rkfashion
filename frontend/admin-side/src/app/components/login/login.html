<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Admin Login</h2>
      <p>Sign in to access the control panel</p>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <!-- Credentials Form -->
    <div class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" placeholder="admin@example.com" [disabled]="loading" />
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" placeholder="••••••••" [disabled]="loading" (keyup.enter)="onLogin()" />
      </div>

      <button class="btn-primary" (click)="onLogin()" [disabled]="loading || !email || !password">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </div>
  </div>
</div>
