<div class="change-password-section">
    <div class="section-title">
        <h4>Change Password</h4>
        <p>Update your password regularly to keep your account secure.</p>
    </div>

    <form (submit)="handleChangePasswordSubmit($event)" class="password-form">
        <div class="row">
            <!-- Current Password -->
            <div class="col-md-12">
                <mat-form-field appearance="outline" class="dense-form-field">
                    <mat-label>Current Password</mat-label>
                    <input matInput 
                           [type]="hideCurrent ? 'password' : 'text'"
                           id="current-password" 
                           name="currentPassword" 
                           placeholder="Enter current password" 
                           [(ngModel)]="currentPassword" 
                           required>
                    <button type="button" mat-icon-button matSuffix (click)="hideCurrent = !hideCurrent" aria-label="Toggle password visibility">
                        <mat-icon style="color: #777777; font-size: 20px;">{{hideCurrent ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                </mat-form-field>
            </div>

            <!-- New Password -->
            <div class="col-md-12">
                <mat-form-field appearance="outline" class="dense-form-field">
                    <mat-label>New Password</mat-label>
                    <input matInput 
                           [type]="hideNew ? 'password' : 'text'"
                           id="new-password" 
                           name="newPassword" 
                           placeholder="Enter new password (min. 6 characters)" 
                           [(ngModel)]="newPassword" 
                           required>
                    <button type="button" mat-icon-button matSuffix (click)="hideNew = !hideNew" aria-label="Toggle password visibility">
                        <mat-icon style="color: #777777; font-size: 20px;">{{hideNew ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                </mat-form-field>
            </div>

            <!-- Confirm Password -->
            <div class="col-md-12">
                <mat-form-field appearance="outline" class="dense-form-field">
                    <mat-label>Confirm New Password</mat-label>
                    <input matInput 
                           [type]="hideConfirm ? 'password' : 'text'"
                           id="confirm-password" 
                           name="confirmPassword" 
                           placeholder="Re-enter new password" 
                           [(ngModel)]="confirmPassword" 
                           required>
                    <button type="button" mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm" aria-label="Toggle password visibility">
                        <mat-icon style="color: #777777; font-size: 20px;">{{hideConfirm ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                </mat-form-field>
            </div>
        </div>

        <div class="form-actions">
            <button type="button" class="cancel-btn" routerLink="/account">Cancel</button>
            <button type="submit" class="save-btn">Change Password</button>
        </div>
    </form>
</div>
